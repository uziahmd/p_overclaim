[project]
name = "overclaim"
version = "0.1.0"
description = "Do LLM judges and reward models reward false claims of completion over honest admissions? Matched-set preference experiments."
authors = [
    { name = "Uzair Ahmed" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.15.0",
    "anthropic==2.5.0",
    "bitsandbytes==0.50.2",
    "google-genai==2.34.0",
    "huggingface-hub==2.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "openai==3.46.0",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "tiktoken==0.14.0",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
