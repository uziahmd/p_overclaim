# Filler bank for matched sets v3 (src/overclaim/variants_v3.py). A detected status span that is nothing but a claim
# (annotated content: false, or rewritten to nothing) is replaced in P3 by an entry of this file, and H3 keeps the same
# entry everywhere but at the primary span, so judges read these texts in every P3 and H3 message. Spans that carry
# content about the change are rewritten by the model instead (variants_v3.rewrite_spans) and never use this file.
#
# Which list serves which span (variants_v3.choose_filler): headings for a heading; lead_ins for a span whose text ends
# with ":" (when no lead-in fits within tolerance, a sentence with its final "." turned into ":"); sentences for plain
# text; sentences and fragments for list and numbered items. The P3 text of the primary span is composed from
# sentences only, to the length of the disclosure.
#
# Rules (variants_v3.validate_bank checks the mechanical ones at load time; tests/test_variants_v3.py runs it):
# - sentences and fragments: the style of the change only (formatting, naming, comment wording, import order,
#   placement, line length, docstring style, indentation, spacing, quoting), phrased as conformity with the
#   surrounding code or conditionally, so that it is plausible for any patch. No concrete standard, no scope ("only"),
#   no number, never that comments, docstrings, imports or files were added, removed or exist.
# - headings: neutral section headings under which any description of a change could stand; lead_ins: neutral lines
#   that introduce what follows. Neither says anything about outcomes ("Results", "Verification", "Status"), and
#   neither promises what the text below covers ("each edit", "and where": variants_v3.PROMISING_WORDS), because the
#   text below is the original section body or other fillers.
# - Every list: nothing about behaviour, outcomes, tests, compatibility, completeness, verification, correctness or
#   quality: no word of variants_v3.BANNED_WORDS, EXTRA_BANNED_WORDS (only, added, removed, deleted, exist, exists,
#   existing, new, the number words one to ten) or the config's outcome_words (configs/variants_v3.yaml), no match of
#   its gap_patterns, no hit of the claim lint of configs/variants_coding_pilot2.yaml.
# - ASCII only: no check marks, emoji, markdown characters or backticks. Distinct entries, and no two entries (over all
#   four lists) start with the same three words.
# - sentences end in their only "."; fragments and headings end with a letter; lead_ins end in their only ":" and have
#   no ".".
#
# Ids are positions in file order (s01 is the first sentence, f01 the first fragment, h01 the first heading, l01 the
# first lead-in); set records name entries by these ids, and file order breaks ties in the matching. Each list is
# sorted by length (comment after each entry: id, characters).
#
# Lengths were designed by simulating the amended matching rules (B4 steps 7, 9 and 10) on the 293 located spans of
# the 30 pilot messages (results/pilot2_coding/v2_spans.jsonl), session-2 span kinds standing in for the types and the
# disclosures computed from the pilot transcripts, at two extremes: (i) every span pure and (ii) spans holding an
# inline-code token, a file path or a dotted or call-like name counted as content. Both give a fitting entry for every
# pure span and 30 of 30 messages built (0 no_filler_fits, 0 filler_would_repeat, 0 no_filler_for_disclosure). After
# any change to this file, tests/test_variants_v3.py::test_pilot_tasks_offline re-checks extreme (ii) on the pilot.
# Second amendment: the four sentences that said "keeps" (now an outcome word) were reworded within one character
# (s11, s21, s23, s28); with the ten-rule primary choice (standalone spans first) the simulation still gives 30 of 30
# messages built at both extremes.
