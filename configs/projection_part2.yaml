# The cut order (a budget rule): applied in order, cumulatively, until the Anthropic total is at or below the
# threshold. remove: row ids (a second-sample row leaves with its base row); set: count parameters of counts_part2.
# Task counts and token bounds in names (here, in the add-backs and in the rows) are placeholders filled from the
# config (projection_v4.fill_names): {rules.<key>}, {shown.<key>} and, in a cut, {set.<key>} from its own `set`.
cuts:
  - {id: A1, name: "Experiment 3 pairwise out", remove: [t2-e3p-s55-c, t2-e3p-s55-r]}
  - {id: A2, name: "pairwise shown, Opus 5.5 out", remove: [t2-ps-o55-c, t2-ps-o55-r]}
  - {id: A3, name: "pairwise shown, Sonnet 5.5 out", remove: [t2-ps-s55-c, t2-ps-s55-r]}
  - {id: A4, name: "pairwise hidden, Opus 4.6 and Opus 5.5 out",
     remove: [t2-ph-o46-c, t2-ph-o46-r, t2-ph-o55-c, t2-ph-o55-r]}
  - {id: A5, name: "pairwise hidden, Sonnet 4.6 out", remove: [t2-ph-s46-c, t2-ph-s46-r]}
  - {id: B1, name: "Opus 5.5 pointwise shown on at most {set.opus_shown_tasks} tasks instead of
                    {rules.opus_shown_tasks}", set: {opus_shown_tasks: 20}}
  - {id: B2, name: "Opus 5.5 out of Experiment 3 pointwise", remove: [t1-e3-o55-c, t1-e3-o55-r]}
  - {id: B3, name: "Opus 4.6 out of pointwise hidden", remove: [t1-pwh-o46-c, t1-pwh-o46-r]}
  - {id: B4, name: "pointwise shown capped at {set.shown_cap_per_domain} tasks per domain (every pointwise shown row
                    and Experiment 3 pointwise)", set: {shown_cap_per_domain: 30}}
# The add-backs, in order, each only if the margin (remainder - total) stays above cut_margin_usd with it.
addbacks:
  - {id: i, name: "Sonnet 5.5 pointwise shown on the coding tasks above {shown.max_transcript_tokens} and up to
                   {shown.upper_band_tokens} rendered tokens", rows: [ab-i-s55-c]}
  - {id: ii, name: "Sonnet 4.6 and Opus 4.6 pointwise shown on at most {rules.addback_ii_tasks} tasks",
     rows: [ab-ii-s46-c, ab-ii-s46-r, ab-ii-o46-c, ab-ii-o46-r]}
  - {id: iii, name: "the mitigated best-of-16", rows: [ab-iii-bo16-c, ab-iii-bo16-r]}
