     remove: [t1-e6-s55-minus-c, t1-e6-o55-minus-c, t1-e6-s46-minus-c, t1-e6-o46-minus-c]}
  - {id: C2, name: "E7 on at most {set.e7_tasks} tasks instead of {rules.e7_tasks}", set: {e7_tasks: 20}}
  - {id: B1, name: "Opus 5.5 pointwise shown on at most {set.opus_shown_tasks} tasks instead of
                    {rules.opus_shown_tasks}", set: {opus_shown_tasks: 20}}
  - {id: B2, name: "Opus 5.5 out of Experiment 3 pointwise", remove: [t1-e3-o55-c]}
  # Part 1's B3 removed Opus 4.6 pointwise hidden (coding and research; no research row is left). Here it takes the
  # judge's E6 rows with it, as a second-sample row leaves with its base row: E6 reports each level's premium over the
  # judge's own H and the paired differences O+ minus O and O minus O- (addendum section 2), and only the pointwise
  # hidden row scores that judge's O and H.
  - {id: B3, name: "Opus 4.6 out of pointwise hidden (its E6 rows too)",
     remove: [t1-pwh-o46-c, t1-e6-o46-plus-c, t1-e6-o46-minus-c]}
  - {id: B4, name: "pointwise shown capped at {set.shown_cap_per_domain} tasks (every pointwise shown row and
                    Experiment 3 pointwise)", set: {shown_cap_per_domain: 30}}
