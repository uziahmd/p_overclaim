# The cut order (addendum section 5, a budget rule): applied in order, cumulatively, until the Anthropic total is at or
# below the threshold. remove: row ids (a second-sample row leaves with its base row); set: count parameters of
# counts_part2. Names take their numbers from the config ({rules.<key>}, {set.<key>}; projection_v4.fill_names).
