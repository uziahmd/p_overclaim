# Cost projection for Part 2 of session 5 (the full run) under the addendum of 2026-11-07 (sections 0, 1, 2, 3, 3b and
# 5), priced before the first call. configs/projection_part2.yaml stays as Part 1's record of the plan before it.
# Run: uv run --no-sync python -m overclaim.projection_v4 --config configs/projection_full_run.yaml
# Arithmetic on recorded costs (overclaim/projection_v4.py, `plan: part2`); nothing is run or called. It reads the run
# files below (read only) and writes the two output files. Both Part 1 gates are known (research failed, Experiment 2
# passed), so every row without a USD figure is unpriced and the run exits with code 1: run it after the freeze stage
# (overclaim.experiments.full_run --stage freeze) has written the full-run sets file, which gives every task count.
#
# Part 2 is coding only, 60 tasks (addendum section 0): no research row. Stats keys are (name, label) as in
# configs/projection_part2.yaml: "@coding" marks the domain, "pointwise/", "vfp/" (the verification-first pointwise
# scorer), "full/" and "e2_score/" the call kind; no prefix is the pairwise judge on the neutral rubric; the bare labels
# "hidden" and "shown" are the ratio basis (pilot 3, where every judge saw the same prompts).
plan: part2
models_config: configs/models.yaml       # prices_usd_per_mtok and the judges' model ids (deepseek-v4-pro added)
output:
  json: results/full_run/projection.json
  markdown: results/full_run/projection.md
reference: claude-sonnet-5-5             # the reference judge of the ratio mechanism (projection.unit_cost)
thought_separate: [gemini-3.8-flash, gemini-4-argon]   # Gemini bills thought tokens as output (unit_stats)
# The decisions of 2026-11-07 this plan applies, printed at the top of the projection.
decisions:
  - "Part 2 is coding only, 60 tasks (addendum section 0): the research gate failed, so the plan has no research row."
  - "A1, Experiment 3 pairwise (the three-label judge), is removed by decision, not cut (addendum section 1): no
     Experiment 3 pairwise row is in the plan."
  - "Add-back (i), Sonnet 5.5 pointwise shown on the band tasks, is a Tier 1 row, as Part 1's projection added it
     (addendum section 0)."
  - "Add-back (iii), the mitigated best-of-16 (H4's second condition), is a Tier 1 row by decision (addendum section
     1)."
  - "Add-back (ii), Sonnet 4.6 and Opus 4.6 pointwise shown, stays skipped by decision (addendum sections 0 and 5)."
  - "A4 and A5 leave the cut order: hidden pairwise is kept for every judge as the secondary finding (addendum
     section 5). The cut order is A2, A3, C1 (O- for the Claude judges), C2 (E7 on 20 tasks), then B1 to B4; it is a
     budget rule, not pre-registered."
  - "Google through vertex (addendum section 3b): every Gemini row draws on the GCP trial credit, zero cash; Flash and
     Argon pointwise shown, the E6 variants, hidden pairwise and the E7 rows on Flash are added."
  - "The new judge deepseek-v4-pro (deepseek/deepseek-v4-pro on OpenRouter, addendum section 3): hidden pointwise, the
     E6 variants, hidden pairwise, shown pointwise and a third Experiment 2 selector; the mitigated open-weight
     selector only if it fits under the OpenRouter stop line. No call of it is measured: its rows are priced from
     another judge's token profile at its list prices (b)."
  - "Exploratory additions (addendum section 2): E5, the reward-model size scan and the reward models as selectors
     (local GPU, 0 USD); E6, O+ and O- on every hidden judge; E7, the instruction-only scorer. E4 makes no call."
  - "Decision (4) of addendum section 0: a judge above the tie line gets the second sample in every condition it
     scores, so the tie rule covers every pointwise row of a judge: hidden (the full rubric too), shown, E6, the
     Experiment 3 verification-first scorer and the E7 scorers. Decision (5): the full-rubric pointwise row is
     preceded by a 9-call parse smoke test."
budget:
  prior_cost_logs:                       # spend before Part 1 (66.41 USD Anthropic, 0.59 OpenRouter)
    - results/pilot_coding/cost.jsonl
    - results/pilot2_coding/cost.jsonl
    - results/pilot3_coding/cost.jsonl
    - results/pilot4_coding/cost.jsonl
  part1_cost_log: results/prep5/cost.jsonl
  anthropic_project_total_usd: 180       # remainder 180 - 66.41 - 11.41 = 102.18 USD (addendum section 5)
  cut_margin_usd: 15                     # cuts while the total exceeds remainder - 15 = 87.18 USD
  openrouter_remaining_usd: 19.0         # addendum section 3: the 20 USD cap, 1.00 spent
  openrouter_stop_launching_usd: 17.0    # addendum section 3: stop launching at 17
  google_route: vertex                   # addendum section 3b: every Gemini row through vertex, zero cash
  google_vertex_credit_usd: 280          # addendum section 3b: the GCP trial credit, about 280 USD
  price_changes:
    - {model: gemini-4-argon, factor: 2.0, from: "2026-12-01"}
gates:
  research: results/prep5/research/gate.json   # failed: the research domain leaves Part 2
  e2: results/prep5/e2_gate.json               # passed
sets:
  coding_main: data/processed/coding/matched_sets_v4_full_run.jsonl   # the frozen main 60 (freeze stage, contract 6A)
  research_v2: data/processed/research/matched_sets_research_v2.jsonl # read by base_part2; no research row uses it
seed: 0                                 # the seed of the Experiment 2 and E7 task picks (prep5_e2.pick_tasks)
shown: {max_transcript_tokens: 40000, upper_band_tokens: 60000}       # shown-eligible at or below the first; band
rules:
  research_tasks: 60                     # the research gate failed: 0 research tasks in the plan
  opus_shown_tasks: 30                   # Opus 5.5 shown (pointwise; pairwise)
  e3_tasks: 60                           # Experiment 3 pointwise: every shown-eligible coding task
  opus_e3_tasks: 30                      # Opus 5.5 on 30 of the Experiment 3 tasks
  e2_tasks_per_domain: 40                # Experiment 2: 40 coding tasks, 16 samples each
  e7_tasks: 30                           # E7: 30 shown-eligible tasks (addendum section 2), cut C2 sets 20
  e7_per_gap: 10                         # the per-gap-type target, for the report only (a short type gives its turns)
# Record files, in order of preference: the first source with live calls for a (grader, label) wins.
record_sources:
  - {path: results/prep5/pointwise_calls.jsonl, domain: coding, rubrics: {pointwise-neutral: pointwise},
     source: "Part 1 plain shown scorer, coding"}
  - {path: results/prep5/e3pw_calls.jsonl, domain: coding, rubrics: {pointwise-verify-first: vfp},
     source: "Part 1 verification-first scorer check, coding"}
  - {path: results/pilot4_coding/judge_calls.jsonl, domain: coding, sets: [v4], rubrics: {neutral: "", full: full},
     source: "pilot 4, v4 sets"}
  - {path: results/pilot4_coding/pointwise_calls.jsonl, domain: coding, sets: [v4],
     rubrics: {pointwise-neutral: pointwise}, source: "pilot 4 pointwise, v4 sets"}
  # Part 2's own pointwise records (added 2026-11-08 after the hidden stage, README amendment 3 item 9: the open-weight
  # mitigated selector re-priced from the judge's measured hidden calls). Listed after the pilots, so a (judge, label)
  # the pilots measured live keeps its pilot profile and every other row's figure is unchanged; deepseek-v4-pro's
  # hidden pointwise profile (300 live calls) comes from here.
  - {path: results/full_run/pointwise_calls.jsonl, domain: coding, sets: [v4_full_run],
     rubrics: {pointwise-neutral: pointwise, pointwise-full: full-pointwise, pointwise-instruction-only: e7},
     source: "Part 2 pointwise, frozen sets"}
  - {path: results/pilot3_coding/judge_calls.jsonl, domain: coding, sets: [v3], rubrics: {neutral: "", full: full},
     source: "pilot 3, v3 sets", ratio_basis: true}
  - {path: results/pilot2_coding/judge_calls.jsonl, domain: coding, sets: [v2], rubrics: {neutral: "", full: full},
     source: "pilot 2, v2 sets"}
# cost.jsonl purposes (names read from the modules that log them), in this order of logs: Part 1's first.
purpose_logs:
  - {path: results/prep5/cost.jsonl}
  - {path: results/pilot4_coding/cost.jsonl}
purpose_stats:
  - {purpose: e2_policy, name: e2_policy, label: packet@coding}
  - {purpose: e2_score, by_model: true, label: e2_score/hidden@coding}
  - {purpose: e2_label, name: e2_label, label: label@coding}
  - {purpose: e2_label_full, name: e2_label_full, label: label@coding}
  - {purpose: reasons_v4, name: reason_classifier, label: reason@coding}   # session 4's four-field classifier
# Read by stats_part2; no row of this plan uses it (no research set is owed).
research_set_unit: {name: research_set_v2, label: build@research, purpose: research_sets_v2,
                    log: results/prep5/cost.jsonl, sets: data/processed/research/matched_sets_research_v2.jsonl}
factors:
  opus_over_sonnet_shown:
    kind: cost_ratio
    text: "Opus 5.5 / Sonnet 5.5 cost per neutral shown pairwise call"
    why: "The measured token and price ratio of the two models on the same shown prompts (derivation a)."
    num: {path: results/pilot3_coding/judge_calls.jsonl, grader: claude-opus-5-5, condition: shown, rubric: neutral,
          set: v3}
    den: {path: results/pilot3_coding/judge_calls.jsonl, grader: claude-sonnet-5-5, condition: shown, rubric: neutral,
          set: v3}
  full_rubric_extra_input:
    kind: input_tokens_diff
    text: "full minus neutral rubric, Sonnet 5.5 hidden pairwise input tokens per call"
    why: >-
      The full-rubric pointwise prompt is the pairwise full rubric transposed into the pointwise template (decision
      (5)); no call of it is measured yet, so the pairwise calls give the full rubric's extra input tokens.
    num: {path: results/pilot3_coding/judge_calls.jsonl, grader: claude-sonnet-5-5, condition: hidden, rubric: full,
          set: v3}
    den: {path: results/pilot3_coding/judge_calls.jsonl, grader: claude-sonnet-5-5, condition: hidden,
          rubric: neutral, set: v3}
  e7_extra_input:
    kind: constant
    value: 32
    text: "one added instruction of 32 o200k tokens, counted by the lead"
    why: "The instruction-only scorer is the plain shown scorer with one added sentence (addendum section 2, E7)."
# Tie rule: a judge whose O/H tie rate in the hidden condition exceeds the threshold gets a second scoring sample per
# message in every condition it scores (decision (4)): the rate is read for (judge, coding) from the hidden records,
# for every row with tie_rule (every pointwise row of a judge: hidden with the full rubric, shown, E6, Experiment 3
# and E7; not the 9-call parse smoke test). A judge without a record (deepseek-v4-pro) is not measured.
tie_rule:
  threshold: 0.5
  contingency_rows: >-
    every pointwise row of the final plan with a tie rate read for its judge (hidden with the full rubric, shown, E6,
    Experiment 3 and E7)
  sources:
    coding:
      - {path: results/pilot4_coding/pointwise_calls.jsonl, rubric: pointwise-neutral}
# The plan, 60 coding tasks. tier: 1 or 2. tasks: a count of overclaim.projection_v4.counts_part2 (or tier2_calls
# for the reason classification), or a number; calls = tasks x per_task. requires_e2: the row leaves with a failed
# Experiment 2 gate. tie_rule: the row's judge is read in the tie-rate table. optional_openrouter: counted in the
# OpenRouter total only when it fits under the stop line. price: methods tried in order (projection_v4.price_method).
rows:
  # ---------------- Tier 1: Experiment 1 pointwise hidden (3 calls per task, neutral) ----------------
  - {id: t1-pwh-s55-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, Sonnet 5.5, coding",
     provider: anthropic, judge: claude-sonnet-5-5, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [claude-sonnet-5-5, pointwise/hidden@coding]}]}
  - {id: t1-pwh-o55-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, Opus 5.5, coding",
     provider: anthropic, judge: claude-opus-5-5, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [claude-opus-5-5, pointwise/hidden@coding]}]}
  - {id: t1-pwh-s46-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, Sonnet 4.6, coding",
     provider: anthropic, judge: claude-sonnet-4-6, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [claude-sonnet-4-6, pointwise/hidden@coding]}]}
  - {id: t1-pwh-o46-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, Opus 4.6, coding",
     provider: anthropic, judge: claude-opus-4-6, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [claude-opus-4-6, pointwise/hidden@coding]}]}
  # The full-rubric pointwise prompt (decision (5)) has no measured call: the neutral pointwise hidden call plus the
  # full rubric's extra input tokens as measured on the pairwise full-rubric calls. The smoke test runs first.
  - {id: t1-pwh-full-smoke-s55-c, tier: 1, group: E1 pointwise hidden, provider: anthropic, judge: claude-sonnet-5-5,
     name: "full-rubric pointwise parse smoke test (9 calls)", domain: coding, tasks: 3, per_task: 3,
     price: [{extra_input: [claude-sonnet-5-5, pointwise/hidden@coding], factor: full_rubric_extra_input}],
     note: "decision (5): 3 tasks x 3 calls before the full-rubric row; the row is dropped, not iterated, if it fails
            to parse"}
  - {id: t1-pwh-full-s55-c, tier: 1, group: E1 pointwise hidden, provider: anthropic, judge: claude-sonnet-5-5,
     name: "E1 pointwise hidden, full rubric, Sonnet 5.5, coding", domain: coding, tie_rule: true, tasks: coding,
     per_task: 3,
     price: [{extra_input: [claude-sonnet-5-5, pointwise/hidden@coding], factor: full_rubric_extra_input}],
     note: "the pairwise full rubric transposed into the pointwise template (decision (5)); no call of it measured yet"}
  - {id: t1-pwh-qwen-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, qwen3-32b, coding",
     provider: openrouter, judge: qwen3-32b, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [qwen3-32b, pointwise/hidden@coding]}]}
  - {id: t1-pwh-oss-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, gpt-oss-120b, coding",
     provider: openrouter, judge: gpt-oss-120b, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [gpt-oss-120b, pointwise/hidden@coding]}]}
  - {id: t1-pwh-deepseek-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, deepseek-v4-pro, coding",
     provider: openrouter, judge: deepseek-v4-pro, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{profile_of: [qwen3-32b, pointwise/hidden@coding], no_cache: true}],
     note: "no measured call of this judge; profile of qwen3-32b"}
  - {id: t1-pwh-flash-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, gemini-3.8-flash, coding",
     provider: google, judge: gemini-3.8-flash, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [gemini-3.8-flash, pointwise/hidden@coding]}], note: vertex}
  - {id: t1-pwh-argon-c, tier: 1, group: E1 pointwise hidden, name: "E1 pointwise hidden, gemini-4-argon, coding",
     provider: google, judge: gemini-4-argon, domain: coding, tie_rule: true, tasks: coding, per_task: 3,
     price: [{measured: [gemini-4-argon, pointwise/hidden@coding]}], note: vertex}
  # Reward models on the local GPU: Skywork-Reward-V2 3B (the headline reward model) and the E5 size scan.
  - {id: t1-rm-sky-c, tier: 1, group: E1 pointwise hidden, name: "E1 reward model, Skywork 3B, coding",
     provider: local, domain: coding, tasks: coding, per_task: 3, price: [{zero: "local GPU, no API call: 0 USD"}]}
  - {id: t1-rm-sky06-c, tier: 1, group: E1 pointwise hidden, name: "E1 reward model, Skywork 0.6B (E5 scan), coding",
     provider: local, domain: coding, tasks: coding, per_task: 3, price: [{zero: "local GPU, no API call: 0 USD"}]}
  - {id: t1-rm-sky17-c, tier: 1, group: E1 pointwise hidden, name: "E1 reward model, Skywork 1.7B (E5 scan), coding",
     provider: local, domain: coding, tasks: coding, per_task: 3, price: [{zero: "local GPU, no API call: 0 USD"}]}
  - {id: t1-rm-sky4-c, tier: 1, group: E1 pointwise hidden, name: "E1 reward model, Skywork 4B (E5 scan, 4-bit), coding",
     provider: local, domain: coding, tasks: coding, per_task: 3, price: [{zero: "local GPU, no API call: 0 USD"}]}
  - {id: t1-rm-sky8q-c, tier: 1, group: E1 pointwise hidden,
     name: "E1 reward model, Skywork 8B 4-bit (E5 scan), coding", provider: local, domain: coding, tasks: coding,
     per_task: 3, price: [{zero: "local GPU, no API call: 0 USD"}], note: "only if it fits in 10 GB (addendum E5)"}
  # ---------------- Tier 1: E6 dose-response, hidden pointwise (one call per message per judge) ----------------
