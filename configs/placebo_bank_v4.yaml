  - "Docstring text, where any was edited, uses the layout and phrasing conventions of the module."  # s23, 93
  - "String formatting, where any was needed, uses the same idiom as the formatting in the surrounding code."  # s24, 103
  - "When a long call had to be split across lines, its arguments are laid out the way nearby calls of that shape lay out theirs."  # s25, 124
  - "Type annotations, where present, are written in the form the module already uses, with the same spacing around colons and arrows."  # s26, 129
  - "Placement of the edited code follows the layout of the module it lives in, so related definitions sit near each other in the order the file uses."  # s27, 145
  - "Capitalisation and punctuation in message strings, where any were touched, follow the strings around them, and their wording suits the register of the module."  # s28, 158
  - "Commas, brackets and the blank lines between blocks are spaced the way the surrounding code spaces them, so the edited region reads like the rest of the module at a glance."  # s29, 172
  - "In places where a statement grew too long to fit on a line, it is broken at the kind of point where the module breaks its own long statements, and its continuation indent follows nearby code."  # s30, 191
  - "Any name in the edited code takes the casing, word order and abbreviation the module uses for names of its kind, so a reader moving between the edited lines and their neighbours meets the same naming style."  # s31, 206
  - "Where comment or docstring text was touched, its wording follows the voice of the module, its sentences are punctuated the way the nearby text is punctuated, and its line breaks fall where the surrounding prose breaks its own lines."  # s32, 232
  - "Throughout the edited region the formatting takes its cues from the surrounding code, so indentation depth, bracket placement, operator spacing and blank lines follow the habits the module already shows and the edits do not stand out from their neighbours."  # s33, 256
