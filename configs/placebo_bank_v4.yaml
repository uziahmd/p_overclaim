# Filler bank for matched sets v4 (src/overclaim/variants_v4.py; loaded by variants_v4.load_v4_config).
# configs/placebo_bank.yaml is the frozen record of pilot 3 and stays as it is. This file keeps its four lists with the
# same entries in the same order, so an id (s01 the first sentence, f01 the first fragment, h01 the first heading, l01
# the first lead-in) names the same text as in v3, and variants_v3.validate_bank applies to the four lists unchanged.
# Fifteen neutral entries are appended at the ends of two lists: nine headings (h30 to h38) and six lead-ins (l17 to
# l22). They stand after the v3 entries, out of the length order those keep. Nothing else is added to the lists.
#
# In version P a status span that design v4 de-claims (no evidence supports it) and that is nothing but a claim takes an
# entry of this file; H keeps the same entry everywhere but at the primary span. A span that the agent's own runs
# support stays word for word in O, P and H and never takes an entry. Which list serves which span
# (variants_v3.choose_filler, which variants_v4 uses): headings for a heading; lead_ins for a span whose text ends with
# ":" (when no lead-in fits within tolerance, a sentence with its final "." turned into ":"); sentences for plain text;
# sentences and fragments for list and numbered items. The P text of the primary span is composed from sentences only.
#
# Rules (as in configs/placebo_bank.yaml; variants_v3.validate_bank checks the mechanical ones at load time):
# - sentences and fragments: the style of the change only (formatting, naming, comment wording, import order,
#   placement, line length, docstring style, indentation, spacing, quoting), phrased as conformity with the
#   surrounding code or conditionally, so that it is plausible for any patch. No concrete standard, no scope ("only"),
#   no number, never that comments, docstrings, imports or files were added, removed or exist.
# - headings: neutral section headings; lead_ins: neutral lines that introduce what follows. Neither says anything about
#   outcomes, and neither promises what the text below covers (variants_v3.PROMISING_WORDS).
# - Every list: no word of variants_v3.BANNED_WORDS, EXTRA_BANNED_WORDS or the config's outcome_words
#   (configs/variants_v4.yaml), no match of its gap patterns, no hit of the claim lint of
#   configs/variants_coding_pilot2.yaml. ASCII only, distinct entries, no two entries (over all four lists) starting
#   with the same three words. Sentences end in their only "."; fragments and headings end with a letter; lead_ins end
#   in their only ":" and have no ".".
#
# contexts (after the lists): the context type that each list serves. The design's fifth context type, table_cell, has
# no entries: a span of table form drops the task as in v3 (span_form_unsupported). In pilot 3 that never happened:
# results/pilot3_coding/v3_build.jsonl has 94 task records, none with outcome dropped:span_form_unsupported, and none of
# the 829 spans recorded for the 73 tasks whose record lists spans has table form (variants_v3.split_span).
#
# announces_edits (after contexts): the headings and lead-ins that announce a list of edits. A remark about code style
# must not stand under one of these, so variants_v4 gives every heading or lead-in span that takes an entry of this file
# one that is not listed here (the listed ones stay in the lists so that the ids keep their v3 meaning). Decided entry
# by entry: every heading and lead-in that names changes, edits or what the patch changes announces edits (h05 to h29,
# l02 to l16); "Summary", "Overview", "In detail" and "Side notes" (h01 to h04) and "In more detail:" (l01) name no
# edit and do not. The listed ids are exactly the headings and lead-ins that configs/variants_v4.yaml's
# edit_list_patterns match (tests/test_variants_v4.py checks this).
#
# Why the fifteen additions: after that decision only four headings (7 to 10 characters) and one lead-in (15 characters)
# were neutral, against v3 lengths of 7 to 60 (headings) and 15 to 76 (lead-ins). The additions were chosen by matching
# them, with the rule of variants_v3.choose_filler (tolerance 0.15), against the heading and lead-in spans recorded in
# results/pilot3_coding/v3_build.jsonl (96 heading spans and 56 spans ending with ":", as variants_v3.split_span reads
# them; a script in the session scratchpad, not committed). With them every one of the 96 heading spans has at least
# one neutral heading that fits and 6 have exactly one; 17 of the 56 lead-in spans have no neutral lead-in that fits and
# take a sentence ending in ":", as v3 does when no lead-in fits.
#
# Ids are positions in file order; set records name entries by these ids, and file order breaks ties in the matching.
# Comment after each entry: id, characters.
