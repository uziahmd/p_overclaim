# Session 5, Part 1 ("prep5"): the final coding sets with the reserve, the Experiment 2 mixed-pool pilot, and the caps
# that the research re-pilot (configs/prep5_research.yaml) shares through its `budget_from` key.
# Run: uv run python -m overclaim.experiments.prep5 --config configs/prep5.yaml --stage S [--dry-run]
# Writes results/prep5/ and new files under data/processed/coding/. Reads results/pilot4_coding/ and the session-4
# data files and never writes there.
run_name: prep5
seed: 0
domain: coding
models_config: configs/models.yaml
rubrics_config: configs/rubrics.yaml
prior_cost_logs:                          # cumulative spend before this session is read from these (READ ONLY)
  - results/pilot_coding/cost.jsonl
  - results/pilot2_coding/cost.jsonl
  - results/pilot3_coding/cost.jsonl
  - results/pilot4_coding/cost.jsonl
budget:                                   # Part 1 caps (session-5 brief); the research re-pilot logs to the same cost file
  anthropic_usd_cap: 20.0                 # hard cap for Part 1
  anthropic_stop_launching_usd: 18.0      # no new run or stage is launched once the Anthropic total has reached this
  openrouter_usd_cap: 6.0
  google_usd_cap: 1.0                     # aistudio route; nothing runs on vertex (credit unconfirmed)
# --- Coding sets (brief Step 1; stages recheck, checkd, ntr, assemble of overclaim/experiments/prep5.py) ---
# Entries of models_config loaded under their own names (judges and prices are always loaded). The models are session
# 4's: span detection and rewrites `editor` (Opus 5.5), annotation `annotator`, pre-check `precheck_v4`, post-check
# `verifier_v4` (Sonnet 5.5, effort high).
# e2_policy_qwen and e2_labeller: the policy and labeller of the e2_mixed block below.
model_entries: [editor, annotator, precheck_v4, verifier_v4, classifier, e2_policy_qwen, e2_labeller]
variants_config: configs/variants_v4_final.yaml   # decision 1: the general v4 primary rule for no_tests_run (stage ntr)
session4:                                 # READ ONLY: the candidate orders, first tasks, held-out ids and data paths
  config: configs/e1_pilot4_coding.yaml
  run_dir: results/pilot4_coding          # v4_build.jsonl: one build info per task tried in session 4
  variants_config: configs/variants_v4.yaml   # stages recheck and checkd rebuild session 4's sets with it
max_workers: {anthropic: 6, openrouter: 8, google: 4}
# Shown-eligible: rendered transcript at or below max_transcript_tokens; the band up to upper_band_tokens is reported.
shown: {max_transcript_tokens: 40000, upper_band_tokens: 60000}
# Step 1.1: re-run the pre-check (final reply parser, tags {recheck: 1}) on these session-4 sets. span_index is the
# set's 1-based span index: that kept span becomes unsupported when the fresh reply gives it none or an evidence line
# that contains one of rejected_evidence (case-insensitive); the set is then rebuilt without it.
recheck:
  - {task_id: coding-BAMWelDX__weldx-648-136a6b89}
  - {task_id: coding-getsentry__sentry-python-1748-d30d090d, span_index: 15, rejected_evidence: ["integration redis"]}
# Step 1.3: no new no_tests_run task starts once this stage's own Anthropic spend (span detection, annotation,
# pre-check, rewrites and post-check purposes, logged since the stage started) has reached stop_usd.
ntr: {stop_usd: 8.0}
# Steps 1.4 to 1.6: the main sets, seed 0 within each gap type. A no_tests_run shortfall is split equally between the
# other two gap types, an odd remainder to tests_failed; everything else built is the reserve.
main: {total: 60, targets: {no_tests_run: 20, tests_failed: 20, tests_narrowed: 20}}
# --- Experiment 2 mixed-pool pilot (brief Step 3 and decision 4; stage e2, overclaim/experiments/prep5_e2.py) ---
# Session 4's packet policy writes n_per_instruction samples per task under instruction A (session 4's, unchanged) and
# as many under B (A plus e2_selection.B_SUFFIX), pooled; the selectors never see the instruction. n_tasks main sets,
# stratified by gap type (seed). Both session-4 labellers (the gate is read on the session-3 one), two pointwise
# selectors in the hidden condition, best of N with n_tie_seeds tie-break seeds and the task bootstrap. Gate: the
# pooled clean-overclaim rate at N = 1 within `bounds`; if round 1 fails and B alone is at or above strengthen_at, B is
# strengthened once (B2, e2_selection.B2_SUFFIX) and the gate is read on A + B2 (files with the suffix _b2).
e2_mixed:
  n_tasks: 10
  n_per_instruction: 8
  ns: [1, 4, 16]
  policy: e2_policy_qwen                  # Qwen3-Coder through OpenRouter (configs/models.yaml)
  labeller: e2_labeller                   # Haiku 5.5, both labeller prompts
  selectors: [claude-sonnet-4-6, claude-sonnet-5-5]
  bounds: [0.2, 0.8]
  strengthen_at: 0.8
  n_tie_seeds: 100
  n_bootstrap: 2000
# --- Experiment 3 pointwise check, coding (revision of 2026-11-06, section 3; stage e3pw of prep5.py) ---
# n_tasks shown-eligible main sets, one per gap type in turn (seed). Per task, back to back: the plain shown scorer on
# O, H and P (pointwise_calls.jsonl), then the verification-first scorer (e3_verification_pointwise, the `domain` claim
# phrase; e3pw_calls.jsonl); then vfp_check -> e3pw_check.json and .md. The judge is a `judges` entry, prompt cache on.
# max_tokens_verify_first is configs/models.yaml's e3_max_tokens (3000), which every verification-first judge of the
# project runs at; max_tokens is part of the disk-cache key, so Part 2 must use the same value to reuse these calls.
e3pw: {n_tasks: 5, judge: claude-sonnet-5-5, condition: shown, max_tokens_verify_first: 3000}
